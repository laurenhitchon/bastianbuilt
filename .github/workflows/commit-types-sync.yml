# Keeps the commit type list in commit-types.mjs and
# git-conventional-commits.yaml in step.
name: Commit type sync

on:
  pull_request:
    paths:
      - commit-types.mjs
      - git-conventional-commits.yaml
      - scripts/conventional-commit-config.sh
      - scripts/check-commit-types-sync.sh
  push:
    branches: [main]
    paths:
      - commit-types.mjs
      - git-conventional-commits.yaml
      - scripts/conventional-commit-config.sh
      - scripts/check-commit-types-sync.sh

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The check reads commit-types.mjs with plain node, so no install is needed.
      - run: ./scripts/check-commit-types-sync.sh
