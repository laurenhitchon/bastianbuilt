# Vendored from digitalnsw/nswds-devops for this personal repository.
# The reusable workflow is SHA-pinned below and updated through Renovate.
# The implementation lives in that repo's reusable-openai-pr-description.yml.
name: Autofill PR description

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  openai-pr-description:
    uses: digitalnsw/nswds-devops/.github/workflows/reusable-openai-pr-description.yml@8f60e2f9065d0e5db18b05614dfc4d30f4204bed # v1
    secrets:
      # Explicit mapping, not inherit — this workflow gets only the secrets it
      # uses; inherit would hand every repo secret to the called workflow.
      # AI_GATEWAY_API_KEY is an org-level secret (Vercel AI Gateway).
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # Optional Azure OpenAI fallback key (used only on gateway HTTP 402).
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
