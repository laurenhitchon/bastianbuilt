# Vendored from digitalnsw/nswds-devops for this personal repository.
# The reusable workflow is SHA-pinned below and updated through Renovate.
# The implementation lives in that repo's reusable-ai-pr-title.yml.
name: AI PR Title Generator

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-title:
    uses: digitalnsw/nswds-devops/.github/workflows/reusable-ai-pr-title.yml@cef727dd6d071996263ee057bd853fbe460039e2 # v1
    secrets:
      # Explicit mapping, not inherit — this workflow gets only the secrets it
      # uses; inherit would hand every repo secret to the called workflow.
      # AI_GATEWAY_API_KEY is an org-level secret (Vercel AI Gateway).
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # Optional Azure OpenAI fallback key (used only on gateway HTTP 402).
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
