# Vendored from digitalnsw/nswds-devops for this personal repository.
# The reusable workflow is SHA-pinned below and updated through Renovate.
# The implementation lives in that repo's reusable-release.yml.
# The elevated permissions live HERE: a reusable workflow can never exceed
# what the caller grants.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: digitalnsw/nswds-devops/.github/workflows/reusable-release.yml@a244014e317c6ab661d7c53ecd9152773b87c3be # v1
    secrets:
      # Explicit mapping, not inherit — the release needs exactly one secret,
      # and inherit would hand every repo secret to the called workflow.
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
