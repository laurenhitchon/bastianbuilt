# Lints every commit in the pull request against commitlint.config.mjs.
# Required by the "Protect main" ruleset as "commitlint / commitlint".
name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint / commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$FROM" --to "$TO" --verbose
